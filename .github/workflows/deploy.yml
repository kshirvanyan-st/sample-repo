name: Deploy

# Ships main to the VPS with Kamal after CI passes.
# Disabled until the repository variable DEPLOY_ENABLED is set to "true".
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ taxi-main ]
  workflow_dispatch:

concurrency:
  group: deploy-taxi-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    env:
      KAMAL_WEB_HOST: ${{ vars.KAMAL_WEB_HOST }}
      APP_HOST: ${{ vars.APP_HOST }}
      KAMAL_IMAGE: ghcr.io/${{ github.repository_owner }}/taxi-am
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_MESSAGING_SERVICE_SID: ${{ vars.TWILIO_MESSAGING_SERVICE_SID }}
      TWILIO_FROM: ${{ vars.TWILIO_FROM }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server host keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$KAMAL_WEB_HOST" >> ~/.ssh/known_hosts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy
        run: bin/kamal deploy

      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 5 --retry-all-errors "https://$APP_HOST/up"
