name: Grainfall

on:
  push:
    paths: ["games/grainfall/**", ".github/workflows/grainfall.yml"]
  pull_request:
    paths: ["games/grainfall/**", ".github/workflows/grainfall.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: games/grainfall

jobs:
  core:
    name: Core tests + level checks
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test (release — the simulation is too slow unoptimised)
        run: swift test -c release -Xswiftc -enable-testing
      - name: Validate every level (needs input, solvable at 3★, traps hold)
        run: swift run -c release grainfall-sim validate
      - name: Render level sheet
        run: |
          mkdir -p out
          swift run -c release grainfall-sim sheet out/levels.png --scale 2
      - uses: actions/upload-artifact@v4
        with:
          name: level-sheet
          path: games/grainfall/out/levels.png

  ios:
    name: iOS app build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: games/grainfall/App
        run: xcodegen generate
      - name: Build for iOS Simulator
        working-directory: games/grainfall/App
        run: |
          set -o pipefail
          xcodebuild -project Grainfall.xcodeproj -scheme Grainfall \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | xcbeautify
      - name: Smoke test in the Simulator (launch, stay alive, screenshots)
        timeout-minutes: 20
        working-directory: games/grainfall/App
        run: |
          set -euo pipefail
          say() { echo "[$(date +%H:%M:%S)] $*"; }
          APP=$(find build/Build/Products -maxdepth 2 -name Grainfall.app -path '*iphonesimulator*' | head -1)
          say "app: $APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          for runtime in sorted(devs, reverse=True):
              if 'iOS' not in runtime: continue
              for d in devs[runtime]:
                  if d['name'].startswith('iPhone'):
                      print(d['udid']); sys.exit()
          ")
          say "simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$UDID" | grep -q Booted && break
            sleep 2
          done
          say "booted"; sleep 20
          xcrun simctl install "$UDID" "$APP"
          say "installed"
          mkdir -p shots
          shoot() { # name, extra launch args...
            local name=$1; shift
            say "launch $name"
            PID=$(xcrun simctl launch --terminate-running-process "$UDID" com.yourstudio.grainfall "$@" | awk '{print $NF}')
            sleep 10
            kill -0 "$PID" || { echo "::error::app exited during '$name'"; exit 1; }
            xcrun simctl io "$UDID" screenshot "shots/$name.png" >/dev/null
            say "shot $name (pid $PID alive)"
          }
          shoot title
          shoot level-1-10 -GFStartLevel 1-10 -GFAutoplay -GFUnlockAll
          shoot level-3-10 -GFStartLevel 3-10 -GFAutoplay -GFUnlockAll
          shoot level-6-10 -GFStartLevel 6-10 -GFAutoplay -GFUnlockAll
          xcrun simctl shutdown "$UDID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: games/grainfall/App/shots/
          if-no-files-found: ignore
      - name: Show compiler errors
        if: failure()
        working-directory: games/grainfall/App
        run: |
          grep -E "error:|warning: .*isolated" build.log | sort -u | head -100 || true
