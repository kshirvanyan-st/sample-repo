name: CI

# This project lives on the orphan branch taxi-main until it moves to its own repository;
# then rename taxi-main to main here and in deploy.yml.
on:
  pull_request:
  push:
    branches: [ taxi-main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Scan the driver app's npm packages
        run: npm audit --omit=dev

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github


  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test
      # postgis:// (not postgres://) so the URL keeps the PostGIS adapter from database.yml
      DATABASE_URL: postgis://postgres:postgres@localhost:5432

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      - name: Prepare database and assets
        run: bin/rails db:test:prepare tailwindcss:build

      - name: Run specs
        run: bin/rspec

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/capybara
          if-no-files-found: ignore

  # The React driver app: unit tests and a production build.
  driver_app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build with Vite
        run: bin/vite build

  # 20 riders booking at once against 5 drivers, with real threads and commits: no driver may be
  # double-booked and every request must end up accepted or "no drivers".
  dispatch:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test
      DATABASE_URL: postgis://postgres:postgres@localhost:5432
      RAILS_MAX_THREADS: 25
      CONCURRENCY_SPECS: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run the dispatch race (three times)
        run: for run in 1 2 3; do bin/rspec --tag concurrency || exit 1; done

  # Real driving routes through Yerevan from OSRM built on the Armenia OpenStreetMap extract.
  routing:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test
      DATABASE_URL: postgis://postgres:postgres@localhost:5432
      ROUTING_ADAPTER: osrm
      OSRM_URL: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Week number (refreshes the map data weekly)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache OSRM data
        uses: actions/cache@v4
        with:
          path: tmp/osrm
          key: osrm-armenia-${{ steps.week.outputs.week }}

      - name: Build OSRM data
        run: bin/osrm-prepare tmp/osrm

      - name: Start OSRM
        run: |
          docker run -d --name osrm -p 5000:5000 -v "$PWD/tmp/osrm:/data" ghcr.io/project-osrm/osrm-backend:v5.27.1 \
            osrm-routed --algorithm mld /data/armenia-latest.osrm
          for i in $(seq 1 30); do curl -sf "$OSRM_URL/route/v1/driving/44.5126,40.1777;44.5152,40.1913" > /dev/null && exit 0; sleep 1; done
          docker logs osrm; exit 1

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run routing specs
        run: bin/rspec --tag osrm

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build production image
        run: docker build --tag taxi-am:ci .

