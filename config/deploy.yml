# Kamal deploy config. Hosts and names come from environment variables so the
# same file works locally and in .github/workflows/deploy.yml.
#   KAMAL_WEB_HOST   IP of the app VPS
#   APP_HOST         public domain, e.g. taxi.example.am
#   KAMAL_IMAGE      e.g. ghcr.io/<owner>/taxi-am
#   KAMAL_REGISTRY_USERNAME / KAMAL_REGISTRY_PASSWORD (see .kamal/secrets)
service: taxi-am

image: <%= ENV.fetch("KAMAL_IMAGE", "taxi-am") %>

servers:
  web:
    - <%= ENV.fetch("KAMAL_WEB_HOST", "192.168.0.1") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST", "taxi.example.am") %>

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "taxi-am") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE
    - TAXI_AM_DATABASE_PASSWORD
    # SMS sign-in codes (set TWILIO_MESSAGING_SERVICE_SID, or TWILIO_FROM for a single sender)
    - TWILIO_ACCOUNT_SID
    - TWILIO_AUTH_TOKEN
    - TWILIO_MESSAGING_SERVICE_SID
    - TWILIO_FROM
  clear:
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: taxi-am-db
    OSRM_URL: http://taxi-am-osrm:5000
    NOMINATIM_URL: http://taxi-am-nominatim:8080
    APP_HOST: <%= ENV.fetch("APP_HOST", "taxi.example.am") %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "taxi_am_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgis/postgis:17-3.5
    host: <%= ENV.fetch("KAMAL_WEB_HOST", "192.168.0.1") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: taxi_am
        POSTGRES_DB: taxi_am_production
      secret:
        - POSTGRES_PASSWORD
    files:
      - config/db/init.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - data:/var/lib/postgresql/data

  # Driving routes, distance and time. Build the data on the host first:
  #   bin/osrm-prepare /var/lib/taxi-am/osrm    (needs Docker; about 1 GB RAM and a minute for Armenia)
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    host: <%= ENV.fetch("KAMAL_WEB_HOST", "192.168.0.1") %>
    cmd: osrm-routed --algorithm mld /data/armenia-latest.osrm
    volumes:
      - /var/lib/taxi-am/osrm:/data

  # Address search. Imports the Armenia extract on first start (about 30 minutes, 4 GB RAM).
  nominatim:
    image: mediagis/nominatim:4.5
    host: <%= ENV.fetch("KAMAL_WEB_HOST", "192.168.0.1") %>
    env:
      clear:
        PBF_URL: https://download.geofabrik.de/asia/armenia-latest.osm.pbf
        REPLICATION_URL: https://download.geofabrik.de/asia/armenia-updates/
        IMPORT_WIKIPEDIA: "false"
    options:
      shm-size: 1g
    directories:
      - nominatim:/var/lib/postgresql/16/main
