# Kamal deploy config. Hosts and names come from environment variables so the
# same file works locally and in .github/workflows/deploy.yml.
#   KAMAL_WEB_HOST   IP of the app VPS
#   APP_HOST         public domain, e.g. spark.example.com
#   KAMAL_IMAGE      e.g. ghcr.io/<owner>/spark
#   KAMAL_REGISTRY_USERNAME / KAMAL_REGISTRY_PASSWORD (see .kamal/secrets)
#   MEDIA_HOST       IP of the media VPS (MediaMTX + Caddy); live streaming is off without it
#   MEDIA_DOMAIN     its public domain, e.g. media.example.com
service: spark

image: <%= ENV.fetch("KAMAL_IMAGE", "spark") %>

servers:
  web:
    - <%= ENV.fetch("KAMAL_WEB_HOST", "192.168.0.1") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST", "spark.example.com") %>

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "spark") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE
    - SPARK_DATABASE_PASSWORD
    - MEDIA_HOOK_SECRET
  clear:
    MEDIA_WEBRTC_URL: https://<%= ENV.fetch("MEDIA_DOMAIN", "media.example.com") %>
    MEDIA_HLS_URL: https://<%= ENV.fetch("MEDIA_DOMAIN", "media.example.com") %>
    MEDIA_API_URL: https://<%= ENV.fetch("MEDIA_DOMAIN", "media.example.com") %>
    MEDIA_RTMP_URL: rtmp://<%= ENV.fetch("MEDIA_DOMAIN", "media.example.com") %>:1935
    # Run the Solid Queue supervisor inside Puma; split into a job role once traffic grows.
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: spark-db
    APP_HOST: <%= ENV.fetch("APP_HOST", "spark.example.com") %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "spark_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    # PostGIS image so Phase 1 can add geo search without a database migration of the server.
    image: postgis/postgis:17-3.5
    host: <%= ENV.fetch("KAMAL_WEB_HOST", "192.168.0.1") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: spark
        POSTGRES_DB: spark_production
      secret:
        - POSTGRES_PASSWORD
    files:
      - config/db/init.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - data:/var/lib/postgresql/data

<% if ENV["MEDIA_HOST"].present? %>
  # Live streaming. Run on their own VPS: Caddy needs ports 80/443, which kamal-proxy holds on the web host.
  # First time: bin/kamal accessory boot mediamtx && bin/kamal accessory boot caddy
  mediamtx:
    image: bluenviron/mediamtx:1.21.2-ffmpeg # the -ffmpeg variant ships wget for the Rails hooks
    host: <%= ENV["MEDIA_HOST"] %>
    cmd: /mediamtx.yml
    files:
      - config/media/mediamtx.yml:/mediamtx.yml
    options:
      network: host # WebRTC needs the host's UDP port 8189 and public IP
    env:
      clear:
        MEDIA_HOOKS_URL: https://<%= ENV.fetch("APP_HOST", "spark.example.com") %>/media/hooks
        MTX_WEBRTCALLOWORIGINS: https://<%= ENV.fetch("APP_HOST", "spark.example.com") %>
        MTX_HLSALLOWORIGINS: https://<%= ENV.fetch("APP_HOST", "spark.example.com") %>
      secret:
        - MEDIA_HOOK_SECRET
        - MTX_AUTHHTTPADDRESS

  caddy:
    image: caddy:2.10
    host: <%= ENV["MEDIA_HOST"] %>
    files:
      - config/media/Caddyfile:/etc/caddy/Caddyfile
    directories:
      - data:/data
    options:
      network: host
    env:
      clear:
        MEDIA_DOMAIN: <%= ENV.fetch("MEDIA_DOMAIN", "media.example.com") %>
<% end %>
