# XcodeGen spec — `brew install xcodegen && xcodegen` generates Grainfall.xcodeproj (spec §8).
name: Grainfall
options:
  bundleIdPrefix: com.yourstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Grainfall:
    path: ..

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  Grainfall:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: Grainfall
        product: GrainfallCore
      - sdk: StoreKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: GameKit.framework
      - sdk: AVFoundation.framework
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Grainfall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [metal, gamekit]
        GKGameCenterBadgingDisabled: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourstudio.grainfall
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Grainfall.entitlements
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: ""  # set your Team ID (or pass DEVELOPMENT_TEAM=... to xcodebuild)
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      storeKitConfiguration: Grainfall.storekit
